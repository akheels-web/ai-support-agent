<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login — National Finance AI Support Operations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/shadcn.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .login-viewport {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1B2F6B 0%, #0F172A 100%);
            padding: 1.5rem;
            position: relative;
        }
        .login-card-container {
            max-width: 420px;
            width: 100%;
            background: hsl(var(--card));
            border-radius: var(--radius);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
            border: 1px solid hsl(var(--border));
            border-top: 4px solid var(--nf-crimson);
            padding: 2.25rem;
            position: relative;
            z-index: 10;
        }
        .login-logo {
            display: block;
            max-width: 210px;
            max-height: 70px;
            margin: 0 auto 1.5rem;
            object-fit: contain;
        }
        .login-footer-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.75rem;
        }
        .login-footer-bar img {
            height: 22px;
            opacity: 0.85;
            object-fit: contain;
        }
        .btn-loader {
            display: none;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-viewport">
        <div class="login-card-container">
            <img class="login-logo" src="{{ nf_logo_url }}" alt="National Finance">
            
            <div style="text-align: center; margin-bottom: 1.75rem;">
                <h2 style="font-size: 1.35rem; font-weight: 800; color: var(--nf-navy); letter-spacing: -0.02em;">Operations Login</h2>
                <p style="font-size: 0.8125rem; color: hsl(var(--muted-foreground)); margin-top: 0.25rem;">AI Voice Support Telemetry Command Center</p>
            </div>

            {% if error %}
            <div class="badge badge-destructive" style="width:100%; margin-bottom:1.25rem; padding:0.5rem; justify-content:center;">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/login" onsubmit="showLoader()">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="form-group">
                    <label class="form-label">Operator Username</label>
                    <input type="text" name="username" class="input" placeholder="Enter username" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="input" placeholder="Enter password" required>
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem; padding: 0.65rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    <i data-lucide="log-in" id="login-icon"></i>
                    <div class="btn-loader" id="login-loader"></div>
                    <span id="login-text">Sign In to Operations</span>
                </button>
            </form>
        </div>

        <div class="login-footer-bar">
            <span>Powered by</span>
            <img src="{{ tct_logo_url }}" alt="TCT Enterprise">
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });

        function showLoader() {
            const btn = document.getElementById('login-btn');
            const icon = document.getElementById('login-icon');
            const loader = document.getElementById('login-loader');
            const text = document.getElementById('login-text');
            
            if (icon) icon.style.display = 'none';
            if (loader) loader.style.display = 'block';
            if (text) text.innerText = 'Authenticating...';
            
            // Note: We don't disable the button immediately as some browsers stop form submission if the submit button is disabled synchronously.
            setTimeout(() => {
                if (btn) btn.disabled = true;
            }, 10);
        }
    </script>
</body>
</html>
