{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <div class="page-title">
        <h1>Change Password</h1>
        <p>Update your operator dashboard credentials</p>
    </div>
</div>

<div class="card" style="max-width: 480px;">
    <div class="card-header">
        <div class="card-header-title">
            <h3 class="card-title">Security Credentials</h3>
            <p class="card-description">Password must be at least 8 characters</p>
        </div>
    </div>
    <div class="card-body">
        {% if error %}
        <div class="badge badge-destructive" style="width:100%; margin-bottom:1rem; padding:0.5rem; justify-content:center;">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/change-password">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" name="current_password" class="input" required>
            </div>

            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="input" minlength="8" required>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="input" minlength="8" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">
                <i data-lucide="lock"></i> Update Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
